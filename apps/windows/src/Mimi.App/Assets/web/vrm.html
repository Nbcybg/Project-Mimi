<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mimi VRM</title>
<!-- The 3D character of the chat stage (the web's feature-vrm.js, the parts the stage uses): a VRM model that
     breathes and blinks, shows the mood of the newest emoji and moves its mouth while a reply streams in.
     Shown by Controls/VrmView.cs in a WebView2; messages from the app arrive as JSON. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const post = (message) => window.chrome?.webview?.postMessage(message);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(1, 2, 2);
scene.add(sun);

let vrm = null;
let current = '';
let view = { yaw: 0, pitch: 0, zoom: 1, x: 0, y: 0 };
let mood = null;
let talkUntil = 0;
let nextBlink = 2;
let last = performance.now();
let elapsed = 0;

// The emoji the web maps to VRM expressions (feature-vrm.js MOODS, the common ones).
const MOODS = {
  happy: ['1f60a', '1f604', '1f601', '1f603', '1f970', '1f60d', '1f619', '1f618', '263a', '1f642', '1f973', '2764', '1f496', '1f495', '1f917'],
  relaxed: ['1f60c', '1f607', '1f609', '1f60b', '1f972', '1f634'],
  surprised: ['1f62e', '1f632', '1f633', '1f631', '1f92f', '2757', '1f62f'],
  sad: ['1f622', '1f62d', '1f97a', '1f61e', '1f614', '1f625', '1f613', '1f629'],
  angry: ['1f620', '1f621', '1f624', '1f92c', '1f47f'],
};
function expressionOf(key) {
  if (!key) return null;
  const first = key.split('-')[0];
  for (const [name, keys] of Object.entries(MOODS)) if (keys.includes(first)) return name;
  return null;
}

function resize() {
  const w = window.innerWidth || 1, h = window.innerHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  frame();
}
window.addEventListener('resize', resize);

/** The camera on the upper body, moved by the chat's own placement (zoom, slide, turn). */
function frame() {
  if (!vrm) return;
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  const target = new THREE.Vector3(0, 1.3, 0);
  if (head) head.getWorldPosition(target);
  const height = Math.max(target.y, 0.5);
  const lookY = height * 0.82 + view.y * 0.01 * height;
  const distance = (height * 1.45) / Math.max(0.3, view.zoom);
  const yaw = (view.yaw || 0) * Math.PI / 180;
  camera.position.set(Math.sin(yaw) * distance - view.x * 0.01 * height, lookY + (view.pitch || 0) * 0.01, Math.cos(yaw) * distance);
  camera.lookAt(-view.x * 0.01 * height, lookY, 0);
}

async function load(url) {
  if (url === current) return;
  current = url;
  try {
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const gltf = await loader.loadAsync(url);
    if (url !== current) return;
    const next = gltf.userData.vrm;
    if (!next) throw new Error('not a VRM file');
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons?.(gltf.scene);
    VRMUtils.rotateVRM0(next);
    if (vrm) {
      scene.remove(vrm.scene);
      VRMUtils.deepDispose(vrm.scene);
    }
    vrm = next;
    scene.add(vrm.scene);
    // Arms down from the T-pose.
    const arm = (name, z) => { const bone = vrm.humanoid?.getNormalizedBoneNode(name); if (bone) bone.rotation.z = z; };
    arm('leftUpperArm', -1.2);
    arm('rightUpperArm', 1.2);
    vrm.update(0);
    resize();
    post({ type: 'ready' });
  } catch (error) {
    if (url === current) post({ type: 'failed', message: String(error && error.message || error) });
  }
}

function setExpression(name, value) {
  try { vrm?.expressionManager?.setValue(name, value); } catch { /* the model has no such expression */ }
}

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const delta = Math.min((now - last) / 1000, 0.1);
  last = now;
  elapsed += delta;
  const time = elapsed;
  if (vrm) {
    const chest = vrm.humanoid?.getNormalizedBoneNode('chest') || vrm.humanoid?.getNormalizedBoneNode('spine');
    if (chest) chest.rotation.x = Math.sin(time * 1.6) * 0.012;
    const head = vrm.humanoid?.getNormalizedBoneNode('head');
    if (head) head.rotation.y = Math.sin(time * 0.5) * 0.05;
    // Blinks every few seconds.
    nextBlink -= delta;
    const blink = nextBlink < 0 ? Math.max(0, 1 - Math.abs(nextBlink + 0.08) / 0.08) : 0;
    if (nextBlink < -0.16) nextBlink = 2 + Math.random() * 3;
    setExpression('blink', blink);
    for (const name of Object.keys(MOODS)) setExpression(name, name === mood ? 0.8 : 0);
    // The mouth while a reply streams in.
    const talking = performance.now() < talkUntil;
    setExpression('aa', talking ? (Math.sin(time * 18) * 0.5 + 0.5) * 0.7 : 0);
    vrm.update(delta);
  }
  renderer.render(scene, camera);
}

window.chrome?.webview?.addEventListener('message', (event) => {
  const message = event.data || {};
  if (message.type === 'load') load(message.url);
  else if (message.type === 'mood') mood = expressionOf(message.key);
  else if (message.type === 'talk') talkUntil = performance.now() + 1200;
  else if (message.type === 'view') { view = { ...view, ...message.view }; frame(); }
  else if (message.type === 'clear') { current = ''; if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); vrm = null; } }
});

resize();
tick();
post({ type: 'page' });
</script>
</body>
</html>
