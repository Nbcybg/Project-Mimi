# Builds the apps and publishes them as a GitHub release when a version tag is pushed:
#   git tag v0.6.0 && git push origin v0.6.0
# The desktop apps (packages/desktop/updater.cjs) and the Android app (web feature-update.js)
# look for the newest release here.
#
# Secrets for the Android signing key (the same key every release, or an update cannot be
# installed over the previous version):
#   ANDROID_KEYSTORE_BASE64    PKCS#12 keystore, base64, key alias "mimi"
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
# Repository variable MIMI_ANDROID_HOST: the server the Android app opens (https host only).
#
# Optional desktop signing (scripts/signing.mjs); without them the builds stay unsigned / ad hoc:
#   WIN_CSC_BASE64, WIN_CSC_PASSWORD     Authenticode .pfx (base64) and its password
#   APPLE_CERT_BASE64, APPLE_CERT_PASSWORD  "Developer ID Application" .p12 (base64) and its password
#   APPLE_SIGN_IDENTITY                  e.g. "Developer ID Application: Example Co (ABCDE12345)"
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID  notarization (app-specific password)
# Every release also carries SHA256SUMS.txt; the desktop updater refuses a zip that does not match it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # NSIS (makensis) makes the installer that goes out beside the zip.
      - run: choco install nsis -y --no-progress
      - run: npm run build:win
        env:
          WIN_CSC_BASE64: ${{ secrets.WIN_CSC_BASE64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Mimi-*-win-*.*
          if-no-files-found: error

  # Apple silicon (arm64) and Intel (x64): the zip is named by the runner's own arch, which is what
  # the desktop updater looks for (Mimi-<version>-mac-<arch>.zip), and node-pty is prebuilt per arch.
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The Developer ID certificate goes into a throwaway keychain for this run only.
      - name: Signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ]; then
            echo "::warning::No APPLE_CERT_BASE64 secret: the Mac app is signed ad hoc and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/mimi.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - run: npm run build:mac
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_CERT_BASE64 && secrets.APPLE_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/Mimi-*-mac-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mimi.p12"
            echo "MIMI_KEYSTORE=$RUNNER_TEMP/mimi.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key and cannot update an installed release."
          fi
      - name: Build APK
        env:
          MIMI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          gradle -p android assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}
          -PmimiHost=${{ vars.MIMI_ANDROID_HOST || 'mimi-production-c4c7.up.railway.app' }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk "Mimi-${{ steps.version.outputs.name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Mimi-*-android.apk
          if-no-files-found: error

  release:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # The desktop updater checks the zip it downloads against this file.
      - run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          # The apps' update checks use GitHub's "latest release", which skips pre-releases.
          # So v0.7.3-prototype is a normal release; only an explicit -rc / -beta tag is held back.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
