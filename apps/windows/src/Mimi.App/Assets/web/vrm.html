<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Mimi VRM</title>
<!-- The 3D character of the chat stage (the web's feature-vrm.js): a VRM model that breathes and blinks, shows the
     mood of the newest emoji and moves its mouth while a reply streams in, and plays the agent's Mixamo motions
     (.fbx, retargeted to the VRM rig) — the idle motion while it stands, any motion on request.
     Shown by Controls/VrmView.cs in a WebView2; messages from the app arrive as JSON. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; transition: opacity .26s ease; }
  /* A change of outfit: fade out, swap the model, fade in (the web's canvas.swap). */
  canvas.swap { opacity: 0; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const post = (message) => window.chrome?.webview?.postMessage(message);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
// The web's stage camera and lights (feature-vrm.js liveStart): the whole figure fits in a 24° view.
const camera = new THREE.PerspectiveCamera(24, 1, 0.05, 30);
const sun = new THREE.DirectionalLight(0xffffff, Math.PI * 0.9);
sun.position.set(0.6, 1.6, 1.4).normalize();
scene.add(sun, new THREE.AmbientLight(0xffffff, 0.75));

let vrm = null;
let mixer = null;
let action = null;
let current = '';
/** The motions the app handed over ({ name, url }), the clips retargeted for the model on screen, and what plays. */
let motionList = [];
const clips = new Map();
let idleName = null;
let playing = null;
let view = { yaw: 0, pitch: 0, zoom: 1, x: 0, y: 0 };
let mood = 'neutral';
let talkUntil = 0;
let blinkTimer = 2;
let blinkUntil = 0;
let last = performance.now();
let elapsed = 0;
/** The model's size as measured once when it is loaded (a motion's raised arms must not move the camera). */
let fit = null;

// Emoji (code points in hex, as the stage keys them) -> expression preset: the web's EMOJI_MOOD (feature-vrm.js).
const EMOJI_MOOD = {};
for (const [preset, keys] of Object.entries({
  happy: '1f60a 1f604 1f601 1f603 1f600 1f970 1f60d 263a 1f642 1f606 1f917 1f60b 1f61d 1f61c 2764 1f495 1f496 1f973 1f44b 1f60e 1f929 2728 1f389 1f338',
  angry: '1f620 1f621 1f624 1f4a2 1f92c 1f47f 1f612 1f644',
  sad: '1f622 1f62d 1f61e 1f614 1f97a 1f63f 1f625 1f613 1f494 1f61f 1f629',
  relaxed: '1f60c 1f634 1f607 1f60f 1f375 1f64f 1f917',
  surprised: '1f632 1f62e 1f631 1f92f 1f633 2757 203c 1f62f 1f640 2049',
})) {
  for (const key of keys.split(' ')) EMOJI_MOOD[key] = preset;
}
const MOOD_WEIGHT = { happy: 0.75, angry: 0.7, sad: 0.75, relaxed: 0.7, surprised: 0.65, neutral: 0 };
/** The preset for an emoji key; the first code point alone counts too (a skin-tone or joined emoji). */
function expressionOf(key) {
  if (!key) return 'neutral';
  return EMOJI_MOOD[key] || EMOJI_MOOD[key.split('-')[0]] || 'neutral';
}

// ---------- Mixamo -> VRM retarget (feature-vrm.js, after the pixiv/three-vrm example) ----------
const MIXAMO_RIG = {
  mixamorigHips: 'hips', mixamorigSpine: 'spine', mixamorigSpine1: 'chest', mixamorigSpine2: 'upperChest',
  mixamorigNeck: 'neck', mixamorigHead: 'head',
  mixamorigLeftShoulder: 'leftShoulder', mixamorigLeftArm: 'leftUpperArm', mixamorigLeftForeArm: 'leftLowerArm', mixamorigLeftHand: 'leftHand',
  mixamorigLeftHandThumb1: 'leftThumbMetacarpal', mixamorigLeftHandThumb2: 'leftThumbProximal', mixamorigLeftHandThumb3: 'leftThumbDistal',
  mixamorigLeftHandIndex1: 'leftIndexProximal', mixamorigLeftHandIndex2: 'leftIndexIntermediate', mixamorigLeftHandIndex3: 'leftIndexDistal',
  mixamorigLeftHandMiddle1: 'leftMiddleProximal', mixamorigLeftHandMiddle2: 'leftMiddleIntermediate', mixamorigLeftHandMiddle3: 'leftMiddleDistal',
  mixamorigLeftHandRing1: 'leftRingProximal', mixamorigLeftHandRing2: 'leftRingIntermediate', mixamorigLeftHandRing3: 'leftRingDistal',
  mixamorigLeftHandPinky1: 'leftLittleProximal', mixamorigLeftHandPinky2: 'leftLittleIntermediate', mixamorigLeftHandPinky3: 'leftLittleDistal',
  mixamorigRightShoulder: 'rightShoulder', mixamorigRightArm: 'rightUpperArm', mixamorigRightForeArm: 'rightLowerArm', mixamorigRightHand: 'rightHand',
  mixamorigRightHandPinky1: 'rightLittleProximal', mixamorigRightHandPinky2: 'rightLittleIntermediate', mixamorigRightHandPinky3: 'rightLittleDistal',
  mixamorigRightHandRing1: 'rightRingProximal', mixamorigRightHandRing2: 'rightRingIntermediate', mixamorigRightHandRing3: 'rightRingDistal',
  mixamorigRightHandMiddle1: 'rightMiddleProximal', mixamorigRightHandMiddle2: 'rightMiddleIntermediate', mixamorigRightHandMiddle3: 'rightMiddleDistal',
  mixamorigRightHandIndex1: 'rightIndexProximal', mixamorigRightHandIndex2: 'rightIndexIntermediate', mixamorigRightHandIndex3: 'rightIndexDistal',
  mixamorigRightHandThumb1: 'rightThumbMetacarpal', mixamorigRightHandThumb2: 'rightThumbProximal', mixamorigRightHandThumb3: 'rightThumbDistal',
  mixamorigLeftUpLeg: 'leftUpperLeg', mixamorigLeftLeg: 'leftLowerLeg', mixamorigLeftFoot: 'leftFoot', mixamorigLeftToeBase: 'leftToes',
  mixamorigRightUpLeg: 'rightUpperLeg', mixamorigRightLeg: 'rightLowerLeg', mixamorigRightFoot: 'rightFoot', mixamorigRightToeBase: 'rightToes',
};

/** The FBX's clip (a Mixamo skeleton) made to play on the VRM's humanoid rig. */
function retarget(asset, model) {
  const clip = THREE.AnimationClip.findByName(asset.animations, 'mixamo.com') || asset.animations[0];
  if (!clip) throw new Error('ไฟล์ FBX นี้ไม่มี animation');
  const hips = asset.getObjectByName('mixamorigHips');
  if (!hips) throw new Error('FBX นี้ไม่ใช่ rig ของ Mixamo');
  const hipsScale = model.humanoid.normalizedRestPose.hips.position[1] / hips.position.y;
  const restInverse = new THREE.Quaternion();
  const parentRest = new THREE.Quaternion();
  const quat = new THREE.Quaternion();
  const vrm0 = model.meta.metaVersion === '0';
  const tracks = [];
  for (const track of clip.tracks) {
    const [rigName, property] = track.name.split('.');
    const boneName = MIXAMO_RIG[rigName];
    const bone = boneName && model.humanoid.getNormalizedBoneNode(boneName);
    const rigNode = asset.getObjectByName(rigName);
    if (!bone || !rigNode) continue;
    rigNode.getWorldQuaternion(restInverse).invert();
    rigNode.parent.getWorldQuaternion(parentRest);
    if (track instanceof THREE.QuaternionKeyframeTrack) {
      const values = track.values.slice();
      for (let i = 0; i < values.length; i += 4) {
        quat.fromArray(values, i).premultiply(parentRest).multiply(restInverse);
        quat.toArray(values, i);
      }
      tracks.push(new THREE.QuaternionKeyframeTrack(`${bone.name}.${property}`, track.times, vrm0 ? values.map((v, i) => (i % 2 === 0 ? -v : v)) : values));
    } else if (track instanceof THREE.VectorKeyframeTrack) {
      const values = track.values.map((v, i) => (vrm0 && i % 3 !== 1 ? -v : v) * hipsScale);
      tracks.push(new THREE.VectorKeyframeTrack(`${bone.name}.${property}`, track.times, values));
    }
  }
  if (tracks.length === 0) throw new Error('Retarget ไม่สำเร็จ — ตัวละครนี้ยังไม่ได้ auto-rig แบบ Mixamo');
  return new THREE.AnimationClip('vrm-' + clip.name, clip.duration, tracks);
}

/** Loads and retargets every motion of the list for the model on screen; tells the app which ones work. */
async function loadMotions() {
  const model = vrm;
  if (!model) return;
  const loaded = [];
  const failed = [];
  for (const entry of motionList) {
    if (clips.has(entry.name)) {
      loaded.push(entry.name);
      continue;
    }
    try {
      const asset = await new FBXLoader().loadAsync(entry.url);
      if (model !== vrm) return;
      clips.set(entry.name, retarget(asset, model));
      loaded.push(entry.name);
    } catch (error) {
      failed.push({ name: entry.name, message: String(error && error.message || error) });
    }
  }
  post({ type: 'motions', loaded, failed });
  if (!playing && idleName && clips.has(idleName)) play(idleName, true);
}

/** Plays a motion (looped, or once and then back to the idle motion / the breathing pose); null stops. */
function play(name, loop) {
  if (!vrm || !mixer) return;
  if (action) action.fadeOut(0.25);
  const clip = name ? clips.get(name) : null;
  if (!clip) {
    action = null;
    playing = null;
    mixer.stopAllAction();
    vrm.humanoid.resetNormalizedPose();
    if (name === null && idleName && clips.has(idleName)) return play(idleName, true);
    post({ type: 'playing', name: null });
    return;
  }
  const next = mixer.clipAction(clip);
  next.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  next.clampWhenFinished = !loop;
  next.reset().fadeIn(0.25).play();
  action = next;
  playing = name;
  post({ type: 'playing', name });
}

function resize() {
  const w = window.innerWidth || 1, h = window.innerHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  frame();
}
window.addEventListener('resize', resize);

/** The model's height, width and middle, measured in its standing pose (once per model). */
function measure() {
  if (!vrm) return;
  const box = new THREE.Box3().setFromObject(vrm.scene);
  fit = {
    height: Math.max(box.max.y - box.min.y, 0.5),
    width: Math.max(box.max.x - box.min.x, 0.4) * 1.1,
    middle: box.min.y + Math.max(box.max.y - box.min.y, 0.5) * 0.5,
  };
}

/**
 * Whole figure in view, feet at the bottom of the stage (the web's liveFrame): the camera orbits the middle of the
 * figure by the chat's turn / tilt / zoom, then camera and target slide together by the chat's x / y.
 */
function frame() {
  if (!vrm) return;
  if (!fit) measure();
  const { height, width, middle } = fit;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  let distance = (height * 1.06) / 2 / Math.tan(fov / 2);
  // A narrow stage must also fit the arms' width.
  distance = Math.max(distance, width / 2 / (Math.tan(fov / 2) * camera.aspect));
  const radius = distance / Math.max(view.zoom, 0.1);
  const turn = THREE.MathUtils.degToRad(view.yaw || 0);
  const tilt = THREE.MathUtils.degToRad(view.pitch || 0);
  const target = new THREE.Vector3(0, middle, 0);
  camera.position.set(
    Math.sin(turn) * Math.cos(tilt) * radius,
    middle + Math.sin(tilt) * radius,
    Math.cos(turn) * Math.cos(tilt) * radius,
  );
  camera.lookAt(target);
  camera.updateMatrixWorld();
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const shift = right.multiplyScalar((-(view.x || 0) / 100) * height).add(up.multiplyScalar((-(view.y || 0) / 100) * height));
  camera.position.add(shift);
  target.add(shift);
  camera.lookAt(target);
}

/**
 * A relaxed standing pose with breathing (the web's liveIdle); the rest pose of a VRM is a T-pose.
 * A VRM 0.x model sits under a scene turned 180° about Y (rotateVRM0), so its bones' x and z axes point the
 * other way: the same rotations there raise the arms instead of lowering them. They are mirrored for it, as
 * retarget() does for the Mixamo motions.
 */
function idlePose(t) {
  const humanoid = vrm.humanoid;
  const mirror = vrm.meta?.metaVersion === '0' ? -1 : 1;
  const set = (name, x, y, z) => {
    const node = humanoid.getNormalizedBoneNode(name);
    if (node) node.rotation.set(x * mirror, y, z * mirror);
  };
  const breath = Math.sin(t * 1.7);
  set('leftUpperArm', 0.05, 0, -1.22 - breath * 0.015);
  set('rightUpperArm', 0.05, 0, 1.22 + breath * 0.015);
  set('leftLowerArm', 0, -0.25, -0.12);
  set('rightLowerArm', 0, 0.25, 0.12);
  set('leftHand', 0, 0, -0.1);
  set('rightHand', 0, 0, 0.1);
  set('spine', breath * 0.012, 0, 0);
  set('chest', breath * 0.018, 0, 0);
  set('neck', 0, Math.sin(t * 0.45) * 0.04, 0);
  set('head', Math.sin(t * 0.7) * 0.025, Math.sin(t * 0.37) * 0.07, Math.sin(t * 0.53) * 0.02);
  set('hips', 0, Math.sin(t * 0.3) * 0.02, 0);
}

/** Blinks, the mood of the last emoji (eased in), and the mouth while talking (the web's liveFace). */
function facePose(delta, t) {
  const manager = vrm.expressionManager;
  if (!manager) return;
  blinkTimer -= delta;
  if (blinkTimer <= 0) {
    blinkTimer = 2.2 + Math.random() * 3.5;
    blinkUntil = t + 0.13;
  }
  const blinking = t < blinkUntil;
  const ease = Math.min(1, delta * 6);
  for (const preset of ['happy', 'angry', 'sad', 'relaxed', 'surprised']) {
    if (!manager.getExpression(preset)) continue;
    const target = mood === preset ? MOOD_WEIGHT[preset] : 0;
    const now = manager.getValue(preset) || 0;
    manager.setValue(preset, now + (target - now) * ease);
  }
  // happy / relaxed close the eyes on their own; a blink on top would look odd.
  manager.setValue('blink', blinking && mood !== 'happy' && mood !== 'relaxed' ? 1 : 0);
  const talking = performance.now() < talkUntil;
  const mouth = talking ? 0.15 + 0.55 * Math.abs(Math.sin(t * 15)) : 0;
  const was = manager.getValue('aa') || 0;
  if (manager.getExpression('aa')) manager.setValue('aa', was + (mouth - was) * Math.min(1, delta * 18));
}

async function load(url) {
  if (url === current) return;
  current = url;
  try {
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    const gltf = await loader.loadAsync(url);
    if (url !== current) return;
    const next = gltf.userData.vrm;
    if (!next) throw new Error('not a VRM file');
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.combineSkeletons?.(gltf.scene);
    VRMUtils.combineMorphs?.(next);
    if (next.meta?.metaVersion === '0') VRMUtils.rotateVRM0(next);
    next.humanoid.resetNormalizedPose();
    // A character scaled up or slid across the stage must not be culled by its rest-pose bounds.
    next.scene.traverse((object) => { object.frustumCulled = false; });
    // The eyes follow the viewer (the camera).
    if (next.lookAt) next.lookAt.target = camera;
    // A change of outfit: fade out, swap, fade in.
    const canvas = renderer.domElement;
    if (vrm) {
      canvas.classList.add('swap');
      await new Promise((resolve) => setTimeout(resolve, 260));
      if (url !== current) {
        VRMUtils.deepDispose(next.scene);
        canvas.classList.remove('swap');
        return;
      }
      scene.remove(vrm.scene);
      VRMUtils.deepDispose(vrm.scene);
    }
    vrm = next;
    scene.add(vrm.scene);
    mixer = new THREE.AnimationMixer(vrm.scene);
    mixer.addEventListener('finished', () => play(null, false));
    action = null;
    playing = null;
    fit = null;
    clips.clear();
    idlePose(0);
    vrm.update(0);
    measure();
    resize();
    canvas.classList.remove('swap');
    post({ type: 'ready' });
    loadMotions();
  } catch (error) {
    if (url === current) post({ type: 'failed', message: String(error && error.message || error) });
  }
}

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const delta = Math.min((now - last) / 1000, 0.1);
  last = now;
  elapsed += delta;
  const time = elapsed;
  if (vrm) {
    if (action) {
      // A Mixamo motion moves the body; the face below stays the stage's.
      mixer.update(delta);
    } else {
      idlePose(time);
    }
    facePose(delta, time);
    vrm.update(delta);
  }
  renderer.render(scene, camera);
}

window.chrome?.webview?.addEventListener('message', (event) => {
  const message = event.data || {};
  if (message.type === 'load') load(message.url);
  else if (message.type === 'mood') mood = expressionOf(message.key);
  else if (message.type === 'talk') talkUntil = performance.now() + 450;
  else if (message.type === 'view') { view = { ...view, ...message.view }; frame(); }
  else if (message.type === 'clear') { current = ''; clips.clear(); action = null; playing = null; mixer = null; fit = null; if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); vrm = null; } renderer.domElement.classList.remove('swap'); }
  else if (message.type === 'motions') {
    const list = Array.isArray(message.list) ? message.list : [];
    const names = new Set(list.map((entry) => entry.name));
    // A motion that changed (new url) or went away is dropped and loaded again.
    for (const entry of motionList) {
      const now = list.find((item) => item.name === entry.name);
      if (!now || now.url !== entry.url) clips.delete(entry.name);
    }
    for (const name of [...clips.keys()]) if (!names.has(name)) clips.delete(name);
    motionList = list;
    const idleBefore = idleName;
    idleName = message.idle || null;
    if (playing && (!clips.has(playing) || playing === idleBefore && idleBefore !== idleName)) play(null, false);
    loadMotions();
  }
  else if (message.type === 'play') play(message.name || null, message.loop !== false);
});

resize();
tick();
post({ type: 'page' });
</script>
</body>
</html>
