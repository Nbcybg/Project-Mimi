[package]
name = "mimi-tauri"
version = "0.0.1"
description = "Mimi UI shell (Tauri 2 spike)"
edition = "2021"

[lib]
name = "mimi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
