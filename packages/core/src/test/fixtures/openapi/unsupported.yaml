openapi: 3.1.0
info:
  title: Edge API
  version: 2.0.0
servers:
  - url: https://api.example.com
security:
  - cookie_auth: []
paths:
  /upload:
    post:
      operationId: uploadFile
      parameters:
        - name: X-Optional
          in: header
          required: false
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /things:
    post:
      operationId: createThing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                choice:
                  oneOf:
                    - type: string
                    - type: number
      responses:
        "200":
          description: Created
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: session
